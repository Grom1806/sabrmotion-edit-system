<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <style>
      @font-face { font-family: "Unbounded"; src: url("assets/fonts/Unbounded[wght].ttf") format("truetype"); font-weight: 200 900; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope[wght].ttf") format("truetype"); font-weight: 200 800; }
      /* SABRMOTION: чёрный / красный / зелёный (vault/02-brands/sabrmotion.md). Фон чистый — БЕЗ зерна и шума. */
      :root { --bg: #0B0B0C; --pn: #16161A; --ln: #2A2A30; --tx: #F4F4F1; --red: #F2283B; --grn: #20DD78; --mut: #8A8A92; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); font-family: "Manrope", sans-serif; color: var(--tx); }
      .sc, #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #world { height: 3840px; }
      .st { position: absolute; left: 0; width: 1080px; height: 1920px; }
      .h { position: absolute; left: 0; right: 0; text-align: center; font-family: "Unbounded", sans-serif; font-weight: 800; line-height: 1.05; letter-spacing: -.02em; white-space: nowrap; }
      .sub { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 40px; color: var(--mut); white-space: nowrap; }

      /* станция 1 — линия → карточка */
      #card1 { position: absolute; left: 120px; top: 640px; width: 840px; height: 560px; border-radius: 36px; background: var(--pn); border: 2px solid var(--ln); box-shadow: 0 40px 90px rgba(0,0,0,.5); }
      #h1 { top: 800px; font-size: 84px; }
      #h1b { top: 900px; font-size: 84px; color: var(--red); }
      #s1sub { top: 1040px; }
      /* станция 2 — счётчик и полосы */
      #lbl2 { top: 2440px; font-size: 40px; color: var(--mut); font-weight: 600; }
      #num { position: absolute; left: 0; right: 0; top: 2540px; text-align: center; font-family: "Unbounded", sans-serif; font-weight: 900; font-size: 220px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: var(--grn); }
      .bar { position: absolute; left: 190px; height: 34px; border-radius: 17px; background: var(--grn); transform-origin: 0 50%; }
      #b1 { top: 2900px; width: 700px; } #b2 { top: 2964px; width: 560px; opacity: .7; } #b3 { top: 3028px; width: 420px; opacity: .45; }
      /* сцена 3 — пилюли */
      .pill { position: absolute; left: 50%; height: 120px; line-height: 120px; padding: 0 56px; border-radius: 60px; transform: translateX(-50%); font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 52px; white-space: nowrap; }
      #p1 { top: 640px; background: var(--tx); color: var(--bg); }
      #p2 { top: 800px; background: var(--red); color: var(--tx); }
      #p3 { top: 960px; background: var(--grn); color: var(--bg); }
      #dot { position: absolute; left: 510px; top: 1300px; width: 60px; height: 60px; border-radius: 30px; background: var(--red); }
      #brand { top: 1400px; font-size: 64px; }
      #caps { position: absolute; left: 60px; right: 60px; top: 1640px; text-align: center; }
      .cap { position: absolute; left: 0; right: 0; font-weight: 800; font-size: 58px; line-height: 1.2; }
    </style>
  </head>
  <body>
    <div id="root" data-clip="ROOT" data-composition-id="main" data-fps="30" data-start="0" data-duration="12.4" data-width="1080" data-height="1920">
      <div id="world" data-layout-allow-overflow>
        <div class="st" id="st1" style="top:0">
          <div id="card1"></div>
          <div class="h" id="h1">Монтаж без</div>
          <div class="h" id="h1b">After Effects</div>
          <div class="sub" id="s1sub">HyperFrames + GSAP + ffmpeg</div>
        </div>
        <div class="st" id="st2" style="top:0">
          <div class="h" id="lbl2">Резкость в покое</div>
          <div id="num">0</div>
          <div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div>
        </div>
      </div>
      <div class="sc" id="s3">
        <div class="pill" id="p1">тик на букву</div>
        <div class="pill" id="p2">без зерна</div>
        <div class="pill" id="p3">−14 LUFS</div>
        <div id="dot"></div>
        <div class="h" id="brand">SABRMOTION</div>
      </div>
      <div id="caps"></div>
      <script type="application/json" id="sfx-dump">[]</script>
      <script type="application/json" id="stats-dump">{}</script>
    </div>

    <script src="lib/sabr.js"></script>
    <script>
      // <words>
      var WORDS = [];
      // </words>
      var END = /*END*/12.4/*/END*/;
      const { tl, S0, FT, show, letters, words, leave, pop, lineToBlock, grow, counter, cam, defocus, captions, finish } = SABR;
      // Ключи времени: с голосом брать из слов — const T = w(/^резкость$/) и т.п.
      const T1 = 0.0, T2 = 3.8, TC = 7.2, T4 = 10.1;

      show("#s3", TC - .2, null); S0("#s3", { opacity: 0 });
      // ═══ 1 · линия → карточка, заголовок по буквам (тик на букву), подпись по словам ═══
      lineToBlock("#card1", T1 + .05, { dur: .6 });
      const h1 = letters("#h1", T1 + .45);
      const h1b = letters("#h1b", h1 - .1);
      words("#s1sub", h1b + .05);
      // ═══ камера едет вниз ко 2-й станции (вжух на пике скорости) ═══
      cam(T2 - .5, { y: -1920 }, .9);
      // ═══ 2 · подпись, счётчик-герой, полосы растут ═══
      words("#lbl2", T2 + .15);
      counter("#num", 0, 100, T2 + .45, 1.1, v => Math.round(v) + "%");
      ["#b1", "#b2", "#b3"].forEach((b, i) => { FT(b, { scaleX: 0 }, { scaleX: 1, duration: .6, ease: "sabr" }, T2 + .55 + i * .12); SABR.S(T2 + .55 + i * .12, "grow", -12, b.slice(1)); });
      // ═══ расфокус-переход в сцену 3 ═══
      defocus("#world", "#s3", TC, .4);
      // ═══ 3 · пилюли-герои с мягким перелётом ═══
      ["#p1", "#p2", "#p3"].forEach((p, i) => pop(p, TC - .1 + i * .3, { from: .5 }));
      // ═══ финал: всё уходит в точку, точка → бренд по буквам ═══
      ["#p1", "#p2", "#p3"].forEach((p, i) => SABR.tl.to(p, { opacity: 0, y: -12, duration: .22, ease: "power2.in" }, T4 - .2 + i * .05));
      SABR.S(T4 - .2, "whoosh", -12, "p1");
      pop("#dot", T4, { from: 0, sound: "pop" });
      letters("#brand", T4 + .25, { kind: "cta" });
      captions("#caps");   // с голосом: фразы из WORDS (captions-v2)
      finish();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;   // регистрация для hyperframes (lint ищет её в index.html)
    </script>
  </body>
</html>
