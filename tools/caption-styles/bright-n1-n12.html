<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Comfortaa;src:url(assets/fonts/Comfortaa.ttf)}
@font-face{font-family:Dela;src:url(assets/fonts/DelaGothicOne.ttf)}
@font-face{font-family:Rubik;src:url(assets/fonts/Rubik.ttf)}
@font-face{font-family:Exo2;src:url(assets/fonts/Exo2.ttf)}
@font-face{font-family:Russo;src:url(assets/fonts/RussoOne.ttf)}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat.ttf)}
@font-face{font-family:Golos;src:url(assets/fonts/Golos-600.ttf)}
@font-face{font-family:SofiaC;src:url(assets/fonts/SofiaSansExtraCondensed.ttf)}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.full{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#scrim{position:absolute;left:0;right:0;top:980px;height:640px;background:radial-gradient(60% 50% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,0) 72%);opacity:0}
.page{position:absolute;left:60px;right:60px;top:1150px;text-align:center;opacity:0}
.w{display:inline-block;position:relative;margin:0 .14em;will-change:transform}
#tag{position:absolute;left:60px;top:150px;font:600 30px Golos;color:#fff;background:rgba(10,10,12,.62);padding:12px 22px;border-radius:40px;letter-spacing:.01em}
#tag b{color:#C6F432;font-weight:600;margin-right:10px}
/* N1 неон-трубка */
.neon{font:700 92px/1.1 Comfortaa;color:#fff}
.neon .w{color:#FFF6FB;text-shadow:0 0 3px #fff,0 0 9px var(--c),0 0 20px var(--c),0 0 42px var(--c),0 0 80px var(--c)}
/* N2 3D-пружина */
.d3{font:400 118px/1.02 Dela;color:#fff;perspective:900px}
.d3 .w{text-shadow:1px 1px 0 #6B21A8,2px 2px 0 #6B21A8,3px 3px 0 #6B21A8,4px 4px 0 #5B1A93,5px 5px 0 #5B1A93,6px 6px 0 #4C1380,7px 7px 0 #4C1380,8px 8px 0 #3D0E6B,9px 10px 18px rgba(0,0,0,.45)}
.d3 .hot{color:#FFE14D}
/* N3 градиент-караоке */
.grad{font:800 84px/1.12 Rubik}
.grad .w{color:rgba(255,255,255,.38);text-shadow:0 3px 14px rgba(0,0,0,.35)}
.grad .w .g{position:absolute;inset:0;background:linear-gradient(90deg,#C6F432,#22D3EE,#A78BFA,#C6F432);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;clip-path:inset(0 100% 0 0);text-shadow:none}
/* N4 плашка, бегущая по словам */
.box{font:800 80px/1.25 Mont;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.4)}
.box .w .bg{position:absolute;left:-14px;right:-14px;top:6%;bottom:2%;background:#FF2E88;border-radius:18px;z-index:-1;transform:scaleX(0);transform-origin:0 50%}
.box .w{isolation:isolate}
/* N5 двухцветная обводка, стопкой */
.stk{font:400 150px/0.98 Russo;text-transform:uppercase}
.stk .w{display:block;margin:0;color:#fff;-webkit-text-stroke:14px var(--c);paint-order:stroke fill;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
/* N6 глитч */
.gl{font:400 300px/1 Dela;color:#fff}
.gl .w .r,.gl .w .b{position:absolute;left:0;top:0;mix-blend-mode:screen}
.gl .w .r{color:#FF2D55}.gl .w .b{color:#2DE1FF}
/* N7 волна по буквам */
.wav{font:800 86px/1.15 Exo2;font-style:italic}
.wav .ch{display:inline-block}
/* N8 блюр-зум с хроматикой */
.bz{font:900 104px/1.05 Mont;color:#fff;text-transform:uppercase;letter-spacing:-.01em}
/* N9 счётчик-неон */
.cnt{font:800 64px/1.1 Rubik;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.45)}
.cnt .num{display:block;font:400 190px/1 Dela;color:#EFFFF4;text-shadow:0 0 4px #fff,0 0 14px #39FF88,0 0 34px #39FF88,0 0 70px #13C26B;margin:6px 0}
/* N10 контур → заливка */
.out{font:900 96px/1.08 SofiaC;font-size:150px;text-transform:uppercase;letter-spacing:.01em}
.out .w{color:transparent;-webkit-text-stroke:3px #fff}
/* N11 караоке-масштаб */
.kar{font:800 82px/1.15 Mont}
.kar .w{margin:0 .24em;color:rgba(255,255,255,.42);text-shadow:0 3px 12px rgba(0,0,0,.35)}
.kar .w i{position:absolute;left:4%;right:4%;bottom:-6px;height:9px;border-radius:6px;background:#FFB800;transform:scaleX(0);font-style:normal}
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="25.6" data-fps="30">
  <video id="head" class="full" src="assets/head.mp4" data-start="0" data-duration="25.55" data-media-start="0" muted playsinline></video>
  <div id="scrim"></div>
  <div id="caps"></div>
  <div id="tag"><b>N1</b><span id="tagt"></span></div>
</div>
<script src="assets/gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
const E = "power3.out";
// [стиль, ярлык, конец страницы, [[слово, время], ...], опции]
const P = [
 ["d3",  "3D-пружина",            1.78, [["Самый",0.0],["дорогой",0.72],["iPhone",1.5]]],
 ["box", "Плашка бежит по словам",3.06, [["только",1.8],["что",1.94],["поступил",2.14],["в",2.62],["продажу",2.66]]],
 ["grad","Градиент-караоке",      4.92, [["стоит",3.1],["ли",3.42],["она",3.6],["своих",3.76],["денег?",3.96],["я",4.32],["думаю",4.7]]],
 ["gl",  "Глитч на ударе",        5.26, [["нет.",4.96]]],
 ["neon","Неон-трубка",           7.40, [["когда",5.28],["она",5.74],["сложена —",6.1],["простой",6.62],["iPhone",7.12]], {c:["#FF3DA5","#FF3DA5","#FF3DA5","#2DE1FF","#2DE1FF"]}],
 ["stk", "Двухцветная обводка",   9.16, [["когда",7.44],["раскрыта",7.68],["iPad",8.6],["mini",9.06]]],
 ["wav", "Волна по буквам",      11.80, [["и",9.2],["она",9.52],["стоит",9.8],["как",10.1],["MacBook",10.34],["или",10.8],["три",11.16],["айпада",11.38]]],
 ["bz",  "Блюр-зум + хроматика",  13.48, [["зачем",11.84],["это",12.32],["вам?",12.56],["iPhone Duo",12.8]]],
 ["cnt", "Счётчик-неон",          17.16, [["за",13.62],["$2 000",14.08],["и получаете только",14.9],["256 ГБ",15.78]], {num:[1,3]}],
 ["out", "Контур → заливка",      21.82, [["а за",17.2],["$3 000",18.04],["2 терабайта",19.8],["очень медленно",20.9]]],
 ["kar", "Караоке + подчёркивание",24.20,[["и",21.86],["не",22.0],["советую.",22.44],["лучше",22.84],["купить",23.72]]],
 ["d3",  "3D-пружина (финал)",    25.55, [["iPad",24.24],["или",24.7],["iPhone",24.96]], {hot:[0,2]}],
];
const caps = document.getElementById("caps"), tagt = document.getElementById("tagt"), tagb = document.querySelector("#tag b");
const pal = ["#FF3D7F","#FFB800","#C6F432","#22D3EE","#A78BFA"];
P.forEach(([st, label, end, words, o = {}], pi) => {
  const pg = document.createElement("div"); pg.className = "page " + st; caps.appendChild(pg);
  const start = words[0][1];
  tl.set(pg, { opacity: 1 }, start);
  tl.call(() => {}, [], start);
  tl.set(tagt, { textContent: label }, start); tl.set(tagb, { textContent: "N" + (pi + 1) }, start);
  tl.fromTo("#tag", { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: .25, ease: E }, start);
  tl.to("#scrim", { opacity: (st === "neon" || st === "cnt") ? 1 : 0, duration: .3 }, start);
  const els = words.map(([t], i) => {
    const s = document.createElement("span"); s.className = "w"; s.textContent = t;
    if (st === "neon") s.style.setProperty("--c", (o.c || [])[i] || "#FF3DA5");
    if (st === "stk") s.style.setProperty("--c", i % 2 ? "#FFB800" : "#FF2E88");
    if (st === "d3" && (o.hot ? o.hot.includes(i) : i === words.length - 1)) s.classList.add("hot");
    if (st === "cnt" && o.num.includes(i)) s.classList.add("num");
    pg.appendChild(s); if (st === "box" || st === "kar" ) {} return s;
  });
  words.forEach(([txt, t], i) => {
    const s = els[i];
    if (st === "d3") {
      gsap.set(s, { opacity: 0, scale: .4, rotateX: -70, y: 40 });
      tl.to(s, { opacity: 1, scale: 1, rotateX: 0, y: 0, duration: .5, ease: "back.out(2.6)" }, t);
    } else if (st === "box") {
      const bg = document.createElement("span"); bg.className = "bg"; s.appendChild(bg);
      gsap.set(s, { opacity: 0, y: 18 });
      tl.to(s, { opacity: 1, y: 0, duration: .18, ease: E }, t);
      tl.fromTo(bg, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: .16, ease: E }, t);
      const nx = words[i + 1] ? words[i + 1][1] : end;
      if (i < words.length - 1) tl.to(bg, { scaleX: 0, transformOrigin: "100% 50%", duration: .14, ease: "power2.in" }, nx - .02);
      gsap.set(s, { rotation: 0 }); tl.to(s, { rotation: i % 2 ? 1.5 : -1.5, duration: .16 }, t);
    } else if (st === "grad") {
      const g = document.createElement("span"); g.className = "g"; g.textContent = txt; s.appendChild(g);
      gsap.set(s, { opacity: 0 });
      tl.to(s, { opacity: 1, duration: .2 }, start + i * .04);
      const nx = words[i + 1] ? words[i + 1][1] : t + .35;
      tl.to(g, { clipPath: "inset(0 0% 0 0)", duration: Math.max(.12, Math.min(.4, nx - t)), ease: "none" }, t);
      tl.fromTo(s, { scale: 1 }, { scale: 1.08, duration: .12, yoyo: true, repeat: 1, ease: "sine.inOut" }, t);
      tl.fromTo(g, { backgroundPosition: "0% 0%" }, { backgroundPosition: "100% 0%", duration: end - start, ease: "none" }, start);
    } else if (st === "gl") {
      ["r", "b"].forEach(c => { const l = document.createElement("span"); l.className = c; l.textContent = txt; s.appendChild(l); });
      const [r, b] = s.querySelectorAll(".r,.b");
      gsap.set(s, { opacity: 0, scale: 1.25 });
      tl.to(s, { opacity: 1, scale: 1, duration: .22, ease: "expo.out" }, t);
      const jit = [[-26, 8], [18, -6], [-12, 4], [8, -3], [-4, 1], [0, 0]];
      jit.forEach(([dx, dy], k) => { tl.set(r, { x: dx, y: dy }, t + k * .035); tl.set(b, { x: -dx, y: -dy }, t + k * .035); });
      tl.set(s, { skewX: -8 }, t); tl.set(s, { skewX: 4 }, t + .07); tl.set(s, { skewX: 0 }, t + .14);
    } else if (st === "neon") {
      gsap.set(s, { opacity: 0 });
      [[0, 1], [.04, .15], [.08, 1], [.13, .35], [.17, 1]].forEach(([dt, a]) => tl.set(s, { opacity: a }, t + dt));
    } else if (st === "stk") {
      gsap.set(s, { opacity: 0, scale: 1.7, rotation: i % 2 ? 6 : -6 });
      tl.to(s, { opacity: 1, scale: 1, rotation: i % 2 ? 2 : -2, duration: .32, ease: "back.out(1.8)" }, t);
    } else if (st === "wav") {
      s.textContent = "";
      [...txt].forEach((ch, k) => { const c = document.createElement("span"); c.className = "ch"; c.textContent = ch;
        c.style.color = pal[(i + k) % pal.length]; c.style.textShadow = "0 4px 0 rgba(0,0,0,.35)"; s.appendChild(c);
        gsap.set(c, { opacity: 0, y: 40 });
        tl.to(c, { opacity: 1, y: 0, duration: .3, ease: "back.out(3)" }, t + k * .025);
        tl.to(c, { y: -10, duration: .35, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((end - t - .4) / .35)) }, t + .32 + k * .05);
      });
    } else if (st === "bz") {
      gsap.set(s, { opacity: 0, scale: 1.6, filter: "blur(14px)", textShadow: "-10px 0 0 rgba(255,45,85,.9), 10px 0 0 rgba(45,225,255,.9)" });
      tl.to(s, { opacity: 1, scale: 1, filter: "blur(0px)", textShadow: "0px 0 0 rgba(255,45,85,0), 0px 0 0 rgba(45,225,255,0)", duration: .34, ease: "expo.out" }, t);
      if (i === words.length - 1) { s.style.display = "block"; s.style.color = "#22D3EE"; s.style.fontSize = "132px"; }
    } else if (st === "cnt") {
      gsap.set(s, { opacity: 0, y: 20 });
      tl.to(s, { opacity: 1, y: 0, duration: .22, ease: E }, t);
      if (s.classList.contains("num")) {
        const target = parseInt(txt.replace(/\D/g, "")), pre = txt.startsWith("$") ? "$" : "", suf = txt.includes("ГБ") ? " ГБ" : "";
        const obj = { v: 0 }; s.textContent = pre + "0" + suf;
        tl.to(obj, { v: target, duration: .6, ease: "power2.out", onUpdate: () => { s.textContent = pre + Math.round(obj.v).toLocaleString("ru-RU").replace(/ /g, " ") + suf; } }, t);
        if (i === 3) { tl.set(els[1], { display: "none" }, t); tl.set(els[0], { opacity: .0 }, t); tl.set(els[2], { opacity: 1 }, t); }
      }
    } else if (st === "out") {
      s.style.display = "block";
      gsap.set(s, { opacity: 0, y: 30 });
      tl.to(s, { opacity: 1, y: 0, duration: .25, ease: E }, t);
      tl.to(s, { color: i % 2 ? "#FFB800" : "#FFFFFF", webkitTextStrokeColor: "rgba(255,255,255,0)", duration: .22, ease: "none" }, t + .22);
      if (i >= 2) tl.to(els[i - 2], { opacity: 0, height: 0, duration: .2 }, t);
    } else if (st === "kar") {
      const u = document.createElement("i"); s.appendChild(u);
      gsap.set(s, { opacity: 0 }); tl.to(s, { opacity: 1, duration: .2 }, start);
      tl.to(s, { color: "#fff", scale: 1.12, duration: .14, ease: E }, t);
      tl.to(u, { scaleX: 1, duration: .2, ease: E }, t);
      const nx = words[i + 1] ? words[i + 1][1] : end;
      if (i < words.length - 1) { tl.to(s, { scale: 1, duration: .14 }, nx); tl.to(u, { scaleX: 0, duration: .12 }, nx); }
    }
  });
  if (pi < P.length - 1) tl.to(pg, { opacity: 0, duration: .08 }, Math.min(end, P[pi + 1][3][0][1] - .09));
});
tl.set({}, {}, 25.6);
window.__timelines = window.__timelines || {};
window.__timelines["root"] = tl;
</script>
</body></html>
