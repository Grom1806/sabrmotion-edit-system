<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<link rel="stylesheet" href="assets/sabr-kit.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow:hidden; background:#0E0E10; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:#0E0E10; }
  .full { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  video.full { object-fit:cover; }
  /* фон-«рабочий стол» для открытия и финала: графит + тонкая жёлтая сетка */
  #bg { background:
      linear-gradient(rgba(234,212,58,.07) 2px, transparent 2px) 0 0/90px 90px,
      linear-gradient(90deg, rgba(234,212,58,.07) 2px, transparent 2px) 0 0/90px 90px,
      radial-gradient(circle at 50% 40%, #232327 0%, #0E0E10 70%); }
  #win0 { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:540px 900px; overflow:hidden; }
  #win0bar { position:absolute; left:0; right:0; top:0; height:70px; background:rgba(14,14,16,.92); display:flex; align-items:center; gap:14px; padding:0 26px; z-index:30; }
  #win0bar i { width:20px; height:20px; border-radius:50%; display:block; }
  #win0bar b { font-family:"SKUI"; font-weight:600; font-size:28px; color:rgba(255,255,255,.8); margin-left:12px; }
  #cam { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:445px 950px; }
  .layer { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .c { left:0; right:0; text-align:center; }
  /* сцены-перебивки */
  #scY { background:
      linear-gradient(rgba(0,0,0,.07) 2px, transparent 2px) 0 0/90px 90px,
      linear-gradient(90deg, rgba(0,0,0,.07) 2px, transparent 2px) 0 0/90px 90px,
      radial-gradient(circle at 50% 45%, #FFF3A8 0%, #EAD43A 55%, #D9BE1E 100%); overflow:hidden; }
  #dev { position:absolute; left:250px; top:520px; width:580px; height:840px; border-radius:58px; overflow:hidden; background:#0E0E10;
         box-shadow: inset 0 0 0 10px #0E0E10, 0 40px 90px rgba(0,0,0,.35); }
  #dev video { position:absolute; left:10px; top:10px; width:560px; height:820px; border-radius:48px; object-fit:cover; }
  #pip { position:absolute; left:40px; top:1690px; width:200px; height:200px; border-radius:36px; overflow:hidden; box-shadow:0 0 0 5px #0E0E10, 0 20px 50px rgba(0,0,0,.35); }
  #pip video { position:absolute; left:-131px; top:-392px; width:560px; height:996px; object-fit:cover; }
  #scW { background:#F6F5F1; }
  #leak { background: radial-gradient(ellipse 60% 45% at 40% 45%, rgba(255,170,60,.95), rgba(255,110,20,.55) 45%, rgba(255,80,0,0) 75%); mix-blend-mode:screen; }
  #flash { background:#fff; }
  /* предметы инфографики */
  .tile { position:absolute; width:120px; height:168px; border-radius:18px; background:#0E0E10; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .tile::after { content:""; position:absolute; inset:9px; border-radius:11px; background:linear-gradient(150deg,#FFE15A,#E5162B 55%,#6B2CF5); }
  .chip { position:absolute; border-radius:30px; background:rgba(14,14,16,.82); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22), 0 24px 60px rgba(0,0,0,.4); }
  .bar { position:absolute; height:22px; border-radius:11px; background:rgba(255,255,255,.14); overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; width:100%; border-radius:11px; background:#EAD43A; transform-origin:0 50%; display:block; }
  .stop { position:absolute; width:190px; height:190px; border-radius:50%;
          background: radial-gradient(circle at 38% 30%, #FF6A78 0%, #E5162B 45%, #8E0614 100%);
          box-shadow: 0 0 0 6px rgba(255,255,255,.12), 0 0 40px rgba(229,22,43,.65), 0 20px 50px rgba(0,0,0,.45); }
  .band { position:absolute; left:-60px; width:1200px; height:270px; background:#E5162B; box-shadow:0 30px 70px rgba(0,0,0,.35); }
  .ipad { position:absolute; left:50%; top:50%; width:300px; height:220px; margin:-110px 0 0 -150px; border-radius:22px; background:#0E0E10; }
  .ipad::after { content:""; position:absolute; inset:12px; border-radius:12px; background:linear-gradient(150deg,#9AD5FF,#3F6BFF 50%,#B03CFF); }
  .iph { position:absolute; left:50%; top:50%; width:170px; height:330px; margin:-165px 0 0 -85px; border-radius:36px; background:#0E0E10; }
  .iph::after { content:""; position:absolute; inset:9px; border-radius:28px; background:linear-gradient(160deg,#FFE15A,#FF7A1A 50%,#E5162B); }
  .iph::before { content:""; position:absolute; left:58px; top:18px; width:54px; height:16px; border-radius:8px; background:#0E0E10; z-index:2; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="25.62" data-fps="30">
  <div id="bg" class="full"></div>

  <!-- окно-кадр: открытие из окошка и возврат в окошко в финале -->
  <div id="win0">
    <div id="cam">
      <video id="head" class="full clip" src="assets/head.mp4" data-start="0" data-duration="25.62" data-media-start="0" muted playsinline></video>
      <div id="behind" class="layer"></div>
      <video id="person" class="full clip" src="assets/person.webm" data-start="0" data-duration="25.62" data-media-start="0" muted playsinline></video>
    </div>
    <div id="win0bar" aria-hidden="true"><i style="background:#E5162B"></i><i style="background:#EAD43A"></i><i style="background:#19C46B"></i><b>iPhone_Duo.mov</b></div>
  </div>
  <div id="front" class="layer"></div>

  <!-- жёлтая студия: сложена / раскрыта -->
  <div id="scY" class="full">
    <div id="dev">
      <video id="v2" class="clip" src="assets/c2_folded.mp4" data-start="5.28" data-duration="2.18" data-media-start="0" muted playsinline></video>
      <video id="v3" class="clip" src="assets/c3_unfold.mp4" data-start="7.44" data-duration="1.78" data-media-start="0.35" muted playsinline></video>
    </div>
    <div id="pip"><video id="pipv" class="clip" src="assets/head.mp4" data-start="5.28" data-duration="3.94" data-media-start="5.28" muted playsinline></video></div>
  </div>
  <!-- белая сцена «зачем это вам» -->
  <div id="scW" class="full">
    <svg id="swoosh" width="1080" height="1920" style="position:absolute;left:0;top:0">
      <path d="M250 1215 C 420 1160, 640 1150, 830 1190" fill="none" stroke="#E5162B" stroke-width="16" stroke-linecap="round"/>
    </svg>
  </div>
  <!-- шарнир крупно -->
  <video id="v4" class="full clip" src="assets/c4_hinge.mp4" data-start="12.80" data-duration="1.02" data-media-start="0" muted playsinline></video>
  <div id="top" class="layer"></div>
  <div id="leak" class="full"></div>
  <div id="flash" class="full"></div>
</div>
<script src="assets/sabr-kit.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
SK.use(tl);
const B = document.getElementById("behind"), F = document.getElementById("front"), TOP = document.getElementById("top");
const Y = document.getElementById("scY"), W = document.getElementById("scW");
// T(родитель, классы, текст, x|'c', y, размер, доп.стили) — позиция только инлайн, чтобы копии (slice/rgb) вставали точно
function T(p, cls, txt, x, y, size, css = {}) {
  const el = SK.mk(p, "sk " + cls + (x === "c" ? " c" : ""), txt, Object.assign({ top: y + "px", fontSize: size + "px" }, x === "c" ? {} : { left: x + "px" }, css));
  return el;
}
// фраза-субтитр = один .cap (единица проверки чтения), слова внутри — отдельные блоки
function CAP(p) { const d = SK.mk(p, "cap layer"); return d; }

gsap.set(["#scY", "#scW", "#v4"], { autoAlpha: 0 });

/* ═══ A · открытие: человек в окошке → камера въезжает в полный кадр ═══ */
gsap.set("#win0", { scale: 0.58, borderRadius: 40 });
tl.to("#win0", { scale: 1, borderRadius: 0, duration: 0.62, ease: "expo.inOut" }, 0.05);
tl.to("#win0bar", { autoAlpha: 0, duration: 0.15 }, 0.45);

const A1 = CAP(B);
const a1 = T(A1, "sk-script sk-y sk-lift", "Самый", 110, 430, 120);
const a2 = T(A1, "sk-cond sk-y sk-lift", "дорогой", "c", 590, 250);
const A1f = CAP(F);
const a3 = T(A1f, "sk-script sk-w sk-lift", "iPhone", 600, 930, 130);
SK.pop(a1, 0.02, { from: 0.7 });
SK.bounce(a2, 0.72);
SK.slide(a3, 1.50, { dir: 1 });
SK.whip([a1, a2], 1.76, "up", { dist: 700 });
SK.whip(a3, 1.76, "right", { dist: 700 });

// окно с официальным роликом + курсор
const wA = SK.win(B, { x: 610, y: 260, w: 410, h: 560, title: "Apple · iPhone Duo", style: "glass",
  html: '<video id="v1" class="clip" src="assets/c1_hook.mp4" data-start="1.80" data-duration="1.30" data-media-start="0" muted playsinline></video>' });
SK.open(wA, 1.80, { rot: 8, endRot: 3 });
const cur = SK.cursor(F); gsap.set(cur, { x: 980, y: 1500 });
SK.glide(cur, 2.05, 800, 640, 0.5); SK.click(cur, 2.62);
tl.to(wA, { scale: 1.06, duration: 0.08, yoyo: true, repeat: 1 }, 2.62);
const A2 = CAP(F);
const a4 = T(A2, "sk-script sk-w sk-lift", "только что", 120, 1180, 96);
const a5 = T(A2, "sk-cond sk-y sk-lift", "поступил", "c", 1280, 230);
const a6 = T(A2, "sk-script sk-w sk-lift", "в продажу", 470, 1510, 104);
SK.pop(a4, 1.80); SK.slice(a5, 2.14); SK.pop(a6, 2.62);
SK.whip([a4, a5, a6], 3.04, "down");
SK.whip(wA, 3.04, "right", { dist: 600 });
tl.set(cur, { autoAlpha: 0 }, 3.04);

/* ═══ B · «стоит ли она своих денег?» — панч-ин, слова за головой и на груди ═══ */
SK.punch("#cam", 3.10, 1.12);
const B1 = CAP(B);
const b1 = T(B1, "sk-cond sk-y sk-lift", "стоит ли", "c", 610, 225);
const B2 = CAP(F);
const b2 = T(B2, "sk-script sk-w sk-lift", "она своих", 110, 1220, 104);
const b3 = T(B2, "sk-cond sk-y sk-lift", "денег?", "c", 1320, 260, { transform: "rotate(-3deg)" });
SK.pop(b1, 3.10); SK.pop(b2, 3.60); SK.pop(b3, 3.96, { from: 1.6, back: 1.8 });
SK.whip([b1], 4.10, "up", { dist: 700 }); SK.whip([b2, b3], 4.28, "left", { dist: 900 });

/* ═══ C · «я думаю — нет» — слайд-стек справа + красная кнопка «стоп» ═══ */
SK.punch("#cam", 4.32, 1.0);
SK.push("#cam", 4.48, 5.26, 1.05);
const C1 = CAP(F);
const c1 = T(C1, "sk-sans sk-w sk-lift", "я", 600, 620, 100);
const c2 = T(C1, "sk-sans sk-w sk-lift", "думаю", 600, 715, 104);
const c3 = T(C1, "sk-sans sk-y sk-bloom", "нет", 592, 815, 200);
const stop = SK.mk(F, "stop", '<svg viewBox="0 0 100 100" width="190" height="190"><rect x="22" y="44" width="56" height="12" rx="6" fill="#fff"/></svg>', { left: "840px", top: "1110px" });
SK.slide(c1, 4.32); SK.slide(c2, 4.70);
SK.rgb(c3, 4.96); SK.spring(stop, 5.00, { rot: -30 });
tl.to(c3, { scale: 1.06, duration: .5, ease: "sine.inOut" }, 5.2);

/* ═══ D · жёлтая студия: «когда она сложена — простой iPhone / раскрыта — просто iPad mini» ═══ */
tl.set([C1, stop], { autoAlpha: 0 }, 5.30);
tl.set("#scY", { autoAlpha: 1 }, 5.28);
tl.fromTo("#scY", { yPercent: 100 }, { yPercent: 0, duration: 0.24, ease: "expo.out", immediateRender: false }, 5.26);
SK.leak("#leak", 5.20, 0.6);
gsap.set("#dev", { transformPerspective: 1600, rotationY: -16, rotationX: 6 });
SK.open("#dev", 5.36, { rot: -6, endRot: 0, dur: 0.6 });
tl.to("#dev", { y: -18, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.96);
gsap.set("#pip", { autoAlpha: 0 }); SK.spring("#pip", 5.50, { rot: 10 });
const D1 = CAP(Y);
const d1 = T(D1, "sk-ui sk-k", "когда она", "c", 120, 60);
const d2 = T(D1, "sk-cond sk-k", "сложена", "c", 190, 235);
const d3 = T(D1, "sk-script sk-k", "простой", 350, 1400, 104);
const d4 = T(D1, "sk-cond sk-r", "iPhone", 380, 1500, 200, { textTransform: "none" });
SK.scan(d1, 5.30, { color: "#0E0E10" }); SK.slice(d2, 6.10); SK.pop(d3, 6.62); SK.bounce(d4, 7.12, { y: -140 });
SK.whip([d1, d2], 7.26, "up", { dist: 600 }); SK.whip([d3, d4], 7.26, "down", { dist: 600 });
// поворот устройства: сложена → раскрыта
tl.to("#dev", { rotationY: 344, duration: 0.42, ease: "power3.inOut" }, 7.30);
gsap.set("#v3", { autoAlpha: 0 }); tl.set("#v3", { autoAlpha: 1 }, 7.48); tl.set("#v2", { autoAlpha: 0 }, 7.48);
const D2 = CAP(Y);
const d5 = T(D2, "sk-ui sk-k", "когда", "c", 120, 60);
const d6 = T(D2, "sk-cond sk-k", "раскрыта", "c", 190, 235);
const d7 = T(D2, "sk-script sk-k", "просто", 330, 1400, 104);
const d8 = T(D2, "sk-cond sk-r", "iPad mini", "c", 1500, 200, { textTransform: "none" });
SK.scan(d5, 7.50, { color: "#0E0E10" }); SK.slice(d6, 7.68); SK.pop(d7, 8.22); SK.letters(d8, 8.60, { stagger: 0.045 });
tl.to("#scY", { yPercent: -100, duration: 0.22, ease: "power3.in" }, 9.10);
tl.set([D2], { autoAlpha: 0 }, 9.32);
tl.set("#scY", { autoAlpha: 0 }, 9.32);

/* ═══ E · «и она стоит как MacBook или три айпада» — окна вокруг головы, караоке на груди ═══ */
SK.push("#cam", 9.20, 11.82, 1.06);
tl.set("#cam", { scale: 1.0 }, 9.18);
const wM = SK.win(B, { x: 600, y: 300, w: 430, h: 340, title: "MacBook Pro", style: "glass", html: '<img src="assets/macbook.jpg">' });
SK.open(wM, 10.30, { rot: 7, endRot: 3 });
const eq = T(B, "sk-cond sk-y sk-lift", "=", 500, 380, 170); SK.spring(eq, 10.80, { rot: 0 });
const tiles = [0, 1, 2].map(i => SK.mk(B, "tile", null, { left: 70 + i * 140 + "px", top: 400 + (i % 2) * 40 + "px", transform: `rotate(${[-8, 3, 9][i]}deg)` }));
tiles.forEach((t, i) => SK.spring(t, 11.16 + i * 0.14, { rot: [-30, 20, 35][i] }));
const E1 = CAP(F);
const e1 = T(E1, "sk-sans sk-w", "и она стоит как", "c", 1270, 74);
const e2 = T(E1, "sk-cond", "MacBook", "c", 1350, 190, { textTransform: "none", color: "#fff" });
const ew = ["и", "она", "стоит", "как"].map(w => `<span>${w}</span>`).join(" ");
e1.innerHTML = ew;
gsap.set(E1, { autoAlpha: 0 }); tl.set(E1, { autoAlpha: 1 }, 9.32);
tl.fromTo(E1, { y: 60 }, { y: 0, duration: .3, ease: "back.out(2)", immediateRender: false }, 9.32);
const es = e1.querySelectorAll("span");
SK.karaoke([[es[0], 9.32], [es[1], 9.52], [es[2], 9.80], [es[3], 10.10], [e2, 10.34]], { on: "#fff" });
tl.to(e2, { color: "#EAD43A", textShadow: "0 0 1px #fff7c2, 0 0 14px rgba(255,222,60,.75), 0 0 42px rgba(255,200,0,.45)", duration: .08 }, 10.34);
SK.whip(E1, 10.58, "down", { dist: 500 });
const E2 = CAP(F);
const e3 = T(E2, "sk-script sk-w sk-lift", "или", "c", 1240, 110);
const e4 = T(E2, "sk-cond sk-y sk-bloom", "три айпада", "c", 1360, 200);
SK.pop(e3, 10.80); SK.slide(e4, 11.16, { dir: -1 });
SK.whip(E2, 11.80, "down");
SK.whip([wM, eq, ...tiles], 11.80, "up", { dist: 900 });

/* ═══ F · белая сцена «зачем это вам?» ═══ */
tl.set("#scW", { autoAlpha: 1 }, 11.84);
tl.fromTo("#scW", { xPercent: 100 }, { xPercent: 0, duration: 0.2, ease: "expo.out", immediateRender: false }, 11.82);
const F1 = CAP(W);
const f1 = T(F1, "sk-sans sk-k", "зачем", "c", 720, 170);
const f2 = T(F1, "sk-sans sk-k", "это", "c", 880, 170);
const f3 = T(F1, "sk-sans sk-r", "вам?", "c", 1040, 190);
SK.depth(f1, 11.86); SK.depth(f2, 12.32); SK.pop(f3, 12.56, { from: 1.8, back: 2 });
const sw = document.querySelector("#swoosh path"); const L = sw.getTotalLength();
gsap.set(sw, { strokeDasharray: L, strokeDashoffset: L });
tl.to(sw, { strokeDashoffset: 0, duration: .22, ease: "power2.out" }, 12.56);
tl.set("#scW", { autoAlpha: 0 }, 12.86);

/* ═══ G · шарнир крупно ═══ */
tl.set("#v4", { autoAlpha: 1 }, 12.80); tl.set("#v4", { autoAlpha: 0 }, 13.82);
SK.flash("#flash", 12.78, "#fff", .1);
const G1 = CAP(TOP);
const g1 = T(G1, "sk-cond sk-y sk-bloom", "iPhone Duo", "c", 1500, 210, { textTransform: "none" });
SK.rgb(g1, 12.84);
tl.set(G1, { autoAlpha: 0 }, 13.82);

/* ═══ H · цены вокруг головы: карточка сверху (за головой), чип справа, субтитры на груди ═══ */
tl.set("#cam", { scale: 1.12 }, 13.80);
SK.punch("#cam", 13.82, 1.0, { dur: .22 });
SK.leak("#leak", 13.74, 0.55);
const pc = SK.mk(B, "chip", null, { left: "150px", top: "300px", width: "760px", height: "400px" });
const pZa = T(pc, "sk-script sk-y", "за", 46, 34, 84);
const price = T(pc, "sk-cond sk-w", "$0", "c", 110, 250, { fontVariantNumeric: "tabular-nums" });
price.id = "price"; price.dataset.read = "text";
const pUsd = T(pc, "sk-ui", "долларов", "c", 336, 34, { color: "rgba(255,255,255,.6)" });
gsap.set(pc, { autoAlpha: 0 });
SK.open(pc, 13.84, { rot: -5, endRot: -2 });
SK.count(price, 14.08, 0, 2000, .5, v => "$" + Math.round(v).toLocaleString("ru-RU"));
const st = SK.mk(B, "chip", null, { left: "625px", top: "830px", width: "390px", height: "250px" });
const stN = T(st, "sk-cond sk-y", "256 ГБ", 34, 40, 120); stN.id = "stN";
const stB = SK.mk(st, "bar", "<i></i>", { left: "34px", top: "190px", width: "322px" });
SK.spring(st, 15.78, { rot: 8 });
gsap.set(stB.firstChild, { scaleX: 0 });
tl.to(stB.firstChild, { scaleX: 0.12, duration: .4, ease: "back.out(2)" }, 16.0);
const H1 = CAP(F);
const h1 = T(H1, "sk-sans sk-w", "<span>и</span> <span>получаете</span> <span>только</span>", "c", 1300, 78);
gsap.set(H1, { autoAlpha: 0 }); tl.set(H1, { autoAlpha: 1 }, 14.90);
tl.fromTo(H1, { y: 50 }, { y: 0, duration: .3, ease: "back.out(2)", immediateRender: false }, 14.90);
const hs = h1.querySelectorAll("span");
SK.karaoke([[hs[0], 14.90], [hs[1], 15.08], [hs[2], 15.56]]);
tl.to(hs[2], { color: "#EAD43A", duration: .08 }, 15.56);
SK.whip(H1, 16.90, "down");
// вторая цена: панч-ин, счётчик 2000 → 3000, чип → 2 ТБ
const H2 = CAP(F);
const h2 = T(H2, "sk-script sk-y sk-lift", "а за", "c", 1250, 110);
const h3 = T(H2, "sk-sans sk-w", "<span>и</span> <span>получаете</span>", "c", 1390, 78);
SK.pop(h2, 17.20);
gsap.set(h3, { autoAlpha: 0 }); tl.set(h3, { autoAlpha: 1 }, 18.88);
const h3s = h3.querySelectorAll("span"); SK.karaoke([[h3s[0], 18.88], [h3s[1], 19.08]]);
SK.punch("#cam", 18.04, 1.09);
SK.count(price, 18.04, 2000, 3000, .5, v => "$" + Math.round(v).toLocaleString("ru-RU"));
tl.fromTo(pc, { scale: 1 }, { scale: 1.07, duration: .1, yoyo: true, repeat: 1, immediateRender: false }, 18.04);
const stN2 = T(st, "sk-cond sk-y", "2 ТБ", 34, 40, 120); stN2.id = "stN2"; gsap.set(stN2, { autoAlpha: 0 });
SK.fade(stN, 19.76, .06); SK.slice(stN2, 19.80, { dist: 200 });
tl.to(stB.firstChild, { scaleX: 1, duration: .5, ease: "back.out(1.6)" }, 20.0);
SK.whip(H2, 20.30, "down");
// «которая очень медленная»: полоса ползёт, буквы растягиваются
SK.punch("#cam", 20.56, 1.0);
const H3 = CAP(F);
const h4 = T(H3, "sk-script sk-w sk-lift", "которая", 120, 1220, 100);
