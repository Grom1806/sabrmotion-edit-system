<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Onest;src:url(fonts/onest-cyr.woff2) format('woff2');font-weight:100 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;src:url(fonts/onest-lat.woff2) format('woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2190-21FF,U+20AC,U+2122}
@font-face{font-family:Literata;font-style:italic;src:url(fonts/literata-it-cyr.woff2) format('woff2');font-weight:200 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Literata;font-style:italic;src:url(fonts/literata-it-lat.woff2) format('woff2');font-weight:200 900;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F}
@font-face{font-family:Elite;src:url(fonts/elite-lat.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;overflow:hidden;background:#0d0c0b;font-family:Onest,sans-serif;position:relative}
.sub{position:absolute;left:0;right:0;bottom:64px;text-align:center;color:#fff;font:500 48px/1.25 Onest;text-shadow:0 2px 6px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.85);z-index:9}
.credit{position:absolute;right:40px;bottom:22px;color:rgba(255,255,255,.62);font:400 17px Onest;letter-spacing:.02em;z-index:9}
/* A: лицо */
.a .bg{position:absolute;inset:0;background:url(w_285.2.png) 38% 30%/104% auto no-repeat;filter:contrast(1.04) saturate(.96)}
.a .relight{position:absolute;inset:0;background:radial-gradient(ellipse 520px 600px at 760px 380px,rgba(0,0,0,0) 40%,rgba(8,6,5,.42) 100%)}
.a .lt{position:absolute;left:1430px;top:560px;color:#f4ece2}
.a .lt b{display:block;font:600 40px Onest;letter-spacing:-.01em}
.a .lt i{display:block;font:italic 400 30px Literata;opacity:.85;margin-top:8px}
.a .lt:before{content:"";display:block;width:56px;height:2px;background:#e9c89a;margin-bottom:22px}
/* B: архив */
.b{background:#c7d4da}
.b .ph{position:absolute;right:160px;top:-60px;height:1180px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);filter:contrast(1.02)}
.b .cap{position:absolute;left:150px;top:280px;color:#1b1a18;width:760px}
.b .cap .y{font:700 150px/1 Onest;letter-spacing:-.04em}
.b .cap .t{font:italic 400 44px/1.2 Literata;margin-top:22px;color:#3b3833}
.b .cap .s{font:500 22px Onest;margin-top:36px;color:#6c6860;letter-spacing:.08em;text-transform:uppercase}
.b .grad{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.b .credit{color:rgba(255,255,255,.75)}
/* C: сцена-объяснение */
.c{background:radial-gradient(ellipse at 50% 45%,#262320 0%,#121110 75%)}
.c .win{position:absolute;width:760px;height:500px;background:#fbfaf7;border:3px solid #111;box-shadow:8px 8px 0 #111}
.c .bar{height:34px;border-bottom:3px solid #111;background:repeating-linear-gradient(#fbfaf7 0 3px,#111 3px 5px);display:flex;justify-content:center;align-items:center}
.c .bar span{background:#fbfaf7;padding:0 14px;font:700 19px Elite,monospace;color:#111}
.c .body{padding:40px 46px;font:400 36px/1.4 Elite,monospace;color:#111}
.c .lnk{border-bottom:3px dashed #111}
.c .w1{left:150px;top:230px}
.c .w2{left:1010px;top:300px}
.c .w2 .body{font:italic 400 40px/1.25 Literata;color:#111;padding-top:70px}
.c .ghostline{position:absolute;left:0;top:0}
.c .lbl{position:absolute;color:#e9c89a;font:600 24px Onest;letter-spacing:.12em;text-transform:uppercase}
/* D: автобус */
.d .bg{position:absolute;inset:0;background:url(bus_sign.png) center/cover}
.d .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.6))}
.d .q{position:absolute;right:130px;top:640px;color:#fff;text-align:right;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.d .q b{display:block;font:700 96px/1 Onest;letter-spacing:-.03em}
.d .q i{display:block;font:italic 400 46px Literata;margin-top:18px;color:#ffe1b5}
</style></head><body>
<div id="L"></div>
<script>
const d=new URLSearchParams(location.search).get('d');document.body.className=d;const L=document.getElementById('L');
if(d==='a')L.innerHTML=`<div class="bg"></div><div class="relight"></div><div class="lt"><b>Уорд Каннингем</b><i>придумал вики в 1995-м</i></div><div class="sub">У вас ужасный баг — система позволяет<br>людям писать что угодно.</div>`;
if(d==='b')L.innerHTML=`<img class="ph" src="hc.jpg"><div class="cap"><div class="y">1987</div><div class="t">Apple выпускает HyperCard —<br>«стопку карточек со ссылками»</div><div class="s">на фото: версия 2.3</div></div><div class="grad"></div><div class="sub">Я начал с программы HyperCard для Macintosh.</div><div class="credit">Фото: Heanaa 2 · CC BY-SA 4.0 · Wikimedia Commons</div>`;
if(d==='c')L.innerHTML=`<div class="win w1"><div class="bar"><span>Patterns</span></div><div class="body">Люди передают идеи<br>друг другу через<br><span class="lnk">ПрогулкуПоОфису</span> →</div></div>
<svg class="ghostline" width="1920" height="1080"><path d="M740 520 C 850 520, 900 560, 1010 560" stroke="#e9c89a" stroke-width="6" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="1010" cy="560" r="7" fill="#e9c89a"/></svg>
<div class="win w2"><div class="bar"><span>ПрогулкаПоОфису</span></div><div class="body">Такой карточки ещё нет.<br>Расскажите о ней.</div></div>
<div class="lbl" style="left:150px;top:180px">есть</div><div class="lbl" style="left:1010px;top:250px">создаётся по ссылке</div>
<div class="sub">А если карточки не было — она создавалась.</div>`;
if(d==='e')L.innerHTML=`<div class="bg" style="position:absolute;inset:0;background:url(bus_stop.png) center/cover"></div>`;
if(d==='d')L.innerHTML=`<div class="bg"></div><div class="shade"></div><div class="q"><b>wiki wiki</b><i>«быстро» по-гавайски</i></div><div class="sub">Мне сказали сесть на автобус Wiki Wiki.</div><div class="credit">Видео: Wikimedia Foundation · CC BY-SA 3.0</div>`;
</script></body></html>
